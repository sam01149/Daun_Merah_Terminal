name: Market Digest Session-Open Runs

# Dipindah dari vercel.json cron ke sini (session 141) — Vercel Hobby plan tidak
# terjamin menjalankan >1 cron/hari secara konsisten (lihat catatan [VERIFY] di
# daun_merah.md), sama seperti OHLCV sync yang sudah lebih dulu dipindah kesini.
# 3 jadwal ini match waktu buka sesi: Asia/Eropa/New York.
#
# Digeser +2 menit dari jam buka sesi persis (S305 lanjutan, 2026-08-11,
# permintaan user) — data kalender ekonomi (calendar_v1, sumber TradingView di
# api/calendar.js) sering rilis TEPAT di jam buka sesi juga: NY 12:30 UTC =
# 08:30 ET adalah jam rilis standar NFP/CPI/PPI/Retail Sales/Jobless Claims;
# Eropa/Asia juga sering berhimpitan (data UK/AU rilis dekat jam buka sesi
# masing-masing). Kalau digest jalan di menit yang SAMA dengan rilis, angka
# actual belum tentu sudah kepropagasi ke TradingView saat kita fetch — jadi
# AI ringkasan/analisa membaca data lama. Buffer 2 menit kasih waktu source
# publish duluan sebelum kita generate.
#
# `schedule:` sempat DIMATIKAN lalu DIKEMBALIKAN dalam sesi yang sama (Session
# 323, 2026-08-20). vps/daemon.js (Q-6, sejak Session 141) memicu endpoint
# yang sama di 3 jadwal identik ini dan biasanya lebih tepat waktu — tapi
# pengecekan live Redis produksi HARI INI menemukan `vps:heartbeat` kosong
# (harusnya diperbarui tiap 60 detik) dan `setup_log_auto:v1` tidak nambah
# entri sama sekali sejak 2026-08-18 — indikasi kuat VPS/Railway sedang down.
# Kalau schedule GH Actions ikut dimatikan saat VPS down, market-digest bisa
# tidak ter-generate SAMA SEKALI. Jadwal dikembalikan sebagai failsafe;
# CRON_DEDUP_WINDOW_MS 3 jam di api/market-digest.js tetap mencegah generate
# dobel begitu VPS pulih (lihat komentar di sana untuk detail insiden 08:35
# WIB yang jadi pemicu window itu dinaikkan).
#
# Digate ke heartbeat VPS (Session 348, 2026-09-02) — kedua pemicu ini tadinya
# SAMA-SAMA menembak endpoint secara buta, tanpa saling tahu. GH Actions cuma
# dapat jatah ~3-4 run/hari dari GitHub (lihat warm-and-watch.yml) TERLEPAS
# dari 3 jadwal yang didaftarkan, jadi realisasinya sering meleset berjam-jam
# dari jam sesi yang dituju. Ditemukan live: straggler GH Actions untuk slot
# Eropa (target 07:02 UTC) baru nembak jam 12:04 UTC — cuma 28 menit sebelum
# jadwal VPS untuk slot New York (12:32 UTC). Saat VPS menembak tepat waktu di
# 12:32, dedup 3 jam di atas menganggap cache 28 menit itu "masih fresh" dan
# SKIP — digest New York yang harusnya segar jadi tidak pernah benar-benar
# ter-generate, walau VPS-nya sendiri sudah benar jalan on-time. Sekarang GH
# Actions cek `vps:heartbeat` (Plan Q-1) dulu: VPS hidup -> GH Actions diam
# (VPS yang pegang jadwal, tepat waktu), VPS mati/tidak kebaca -> GH Actions
# BARU jalan sebagai fallback sungguhan seperti niat aslinya Session 323.
on:
  schedule:
    - cron: '2 0 * * *'   # 00:02 UTC = 07:02 WIB — sesi Asia (+2 menit)
    - cron: '2 7 * * *'   # 07:02 UTC = 14:02 WIB — sesi Eropa/London (+2 menit)
    - cron: '32 12 * * *' # 12:32 UTC = 19:32 WIB — sesi New York (+2 menit)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Cek heartbeat VPS Railway (VPS hidup = biar VPS saja yang pegang jadwal ini)
        id: vps
        run: |
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" \
            -H "x-admin-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 15 \
            "https://financial-feed-app.vercel.app/api/admin?action=health&source=vps_heartbeat")
          cat /tmp/health.json
          VPS_STATUS=$(jq -r '.sources.vps_heartbeat.status // "DOWN"' /tmp/health.json 2>/dev/null || echo "DOWN")
          echo "HTTP $STATUS, vps_heartbeat status: $VPS_STATUS"
          if [ "$STATUS" = "200" ] && [ "$VPS_STATUS" = "OK" ]; then
            echo "alive=true" >> "$GITHUB_OUTPUT"
          else
            echo "alive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger market digest generation (fallback — VPS tidak sehat)
        if: steps.vps.outputs.alive == 'false'
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 55 \
            "https://financial-feed-app.vercel.app/api/market-digest")
          cat /tmp/resp.json
          if [ "$STATUS" -ne 200 ]; then
            echo "Digest generation failed with HTTP $STATUS"
            exit 1
          fi
          # XAU/USD ANALISA generation TIDAK LAGI dijadwalkan di sini (2026-08-10,
          # permintaan user) — Analisa XAU/USD sekarang murni via tombol "Analisa
          # Pair Ini" di app, sama seperti pair lain. Hasil analisa yang sudah
          # ditekan user disimpan permanen di client (lihat _analisaRestoreFromStorage
          # di index.html), tidak lagi dibuang otomatis berdasar umur.
