name: Market Digest Session-Open Runs

# Dipindah dari vercel.json cron ke sini (session 141) — Vercel Hobby plan tidak
# terjamin menjalankan >1 cron/hari secara konsisten (lihat catatan [VERIFY] di
# daun_merah.md), sama seperti OHLCV sync yang sudah lebih dulu dipindah kesini.
# 3 jadwal ini match waktu buka sesi: Asia/Eropa/New York.
#
# Digeser +2 menit dari jam buka sesi persis (S305 lanjutan, 2026-08-11,
# permintaan user) — data kalender ekonomi (calendar_v1, sumber TradingView di
# api/calendar.js) sering rilis TEPAT di jam buka sesi juga: NY 12:30 UTC =
# 08:30 ET adalah jam rilis standar NFP/CPI/PPI/Retail Sales/Jobless Claims;
# Eropa/Asia juga sering berhimpitan (data UK/AU rilis dekat jam buka sesi
# masing-masing). Kalau digest jalan di menit yang SAMA dengan rilis, angka
# actual belum tentu sudah kepropagasi ke TradingView saat kita fetch — jadi
# AI ringkasan/analisa membaca data lama. Buffer 2 menit kasih waktu source
# publish duluan sebelum kita generate.
on:
  schedule:
    - cron: '2 0 * * *'   # 00:02 UTC = 07:02 WIB — sesi Asia (+2 menit)
    - cron: '2 7 * * *'   # 07:02 UTC = 14:02 WIB — sesi Eropa/London (+2 menit)
    - cron: '32 12 * * *' # 12:32 UTC = 19:32 WIB — sesi New York (+2 menit)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger market digest generation
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 55 \
            "https://financial-feed-app.vercel.app/api/market-digest")
          cat /tmp/resp.json
          if [ "$STATUS" -ne 200 ]; then
            echo "Digest generation failed with HTTP $STATUS"
            exit 1
          fi
          # XAU/USD ANALISA generation TIDAK LAGI dijadwalkan di sini (2026-08-10,
          # permintaan user) — Analisa XAU/USD sekarang murni via tombol "Analisa
          # Pair Ini" di app, sama seperti pair lain. Hasil analisa yang sudah
          # ditekan user disimpan permanen di client (lihat _analisaRestoreFromStorage
          # di index.html), tidak lagi dibuang otomatis berdasar umur.
