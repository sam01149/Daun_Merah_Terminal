name: OHLCV Hourly Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OHLCV sync
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://financial-feed-app.vercel.app/api/admin?action=ohlcv_sync")
          cat /tmp/resp.json
          if [ "$STATUS" -ne 200 ]; then
            echo "Sync failed with HTTP $STATUS"
            exit 1
          fi

      - name: Keep economic calendar warm
        continue-on-error: true
        run: |
          for URL in "https://financial-feed-app.vercel.app/api/calendar" "https://financial-feed-app.vercel.app/api/calendar?week=next"; do
            STATUS=$(curl -s -o /tmp/cal_resp.json -w "%{http_code}" \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              "$URL")
            FETCHED_AT=$(jq -r '.fetched_at // "n/a"' /tmp/cal_resp.json 2>/dev/null || echo "n/a")
            echo "GET $URL -> HTTP $STATUS, fetched_at=$FETCHED_AT"
          done
