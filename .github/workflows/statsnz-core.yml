name: Stats NZ Core Inflation

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Perbarui inflasi inti NZD dari Stats NZ
        run: |
          STATUS=$(curl -sS -o /tmp/statsnz-core.json -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" --max-time 58 \
            "https://financial-feed-app.vercel.app/api/admin?action=statsnz_core&mode=sync")
          cat /tmp/statsnz-core.json
          if [ "$STATUS" -ne 200 ]; then exit 1; fi
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/statsnz-core.json','utf8'));if(x.error)process.exit(1)"
