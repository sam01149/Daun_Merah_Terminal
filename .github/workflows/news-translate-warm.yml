name: News Translate Warm

# Tujuan (S272, 2026-08-02): translate NEWS ke Bahasa Indonesia (api/_news_translate.js)
# cuma jalan kalau ADA request masuk ke /api/feeds?type=rss (rssHandler, cache-miss
# path) — sebelum ini, refresh+translate 100% bergantung traffic client aktif. Kalau
# aplikasi ditutup lama, headline baru tidak pernah diterjemahkan sampai ada yang buka
# lagi. sw.js SUDAH punya periodicsync (tag fjfeed-sync) yang ikut memicu hal yang
# sama, TAPI browser tidak menjamin intervalnya (Chrome pakai budget/engagement-score
# internal, bisa jarang-jarang/berjam-jam terutama kalau app jarang dibuka), dan cuma
# didukung Chromium. Workflow ini ping endpoint yang sama tiap 5 menit, independen
# dari client mana pun — server selalu fresh + translate selalu tergerus teratur,
# terlepas dari kapan/seberapa sering user buka aplikasi.
#
# Cakupan: jendela LIVE feed (headline beberapa jam terakhir, step pertama) DAN
# (S276, 2026-08-02, permintaan user) arsip 36 jam PENUH via step kedua
# (type=news_translate_backfill) — supaya "Muat Berita Lebih Lama" sudah Indonesia
# duluan begitu diklik, bukan translate-on-demand yang bikin jeda.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/feeds?type=rss (trigger cache-refill + translate jendela live)
        run: |
          STATUS=$(curl -s -o /tmp/resp.xml -w "%{http_code}" \
            --max-time 25 \
            "https://financial-feed-app.vercel.app/api/feeds?type=rss")
          echo "HTTP $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "RSS warm gagal dengan HTTP $STATUS"
            cat /tmp/resp.xml
            exit 1
          fi
      - name: Ping /api/feeds?type=news_translate_backfill (sapu arsip 36 jam penuh)
        run: |
          STATUS=$(curl -s -o /tmp/resp2.json -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 25 \
            "https://financial-feed-app.vercel.app/api/feeds?type=news_translate_backfill")
          cat /tmp/resp2.json
          echo "HTTP $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Translate backfill gagal dengan HTTP $STATUS"
            exit 1
          fi
