name: Health Watch (fallback alert)

# Audit 2026-08-27: probeVpsHeartbeat + sendHealthTelegram (api/admin.js
# healthHandler) sudah ada dan sudah bisa mendeteksi VPS Railway mati + kirim
# alert Telegram — tapi TIDAK ADA yang memicu ?action=health secara terjadwal
# dari dalam repo ini. Selama ini bergantung layanan luar (cron-job.org, di
# luar tracking git, tidak terverifikasi) atau cek manual dashboard. Insiden
# 2026-08-20 (vps:heartbeat kosong) sempat luput karena itu. Workflow ini
# memicu action=health tiap 5 menit (selaras ambang basi 5 menit di
# probeVpsHeartbeat) supaya deteksi DOWN/recovery + alert Telegram pasti
# jalan dari sumber yang terlacak di repo, sama pola dengan
# setup-tp-sl-watch.yml (fallback GH Actions paralel dengan daemon Railway).
# Endpoint read-only (cuma probe + alert), tidak menyentuh gate/logika
# auto-entry apa pun.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger health probe (semua source, termasuk vps_heartbeat)
        run: |
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" \
            -H "x-admin-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 20 \
            "https://financial-feed-app.vercel.app/api/admin?action=health")
          cat /tmp/health.json
          if [ "$STATUS" -ne 200 ]; then
            echo "health check endpoint gagal HTTP $STATUS"
            exit 1
          fi
